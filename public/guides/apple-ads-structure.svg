<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="840" height="430" fill="#FFFFFF"/>

  <!-- liens -->
  <g stroke="#B9B3C6" stroke-width="1.5" fill="none">
    <path d="M420 96 L420 122 M150 122 L690 122 M150 122 L150 150 M690 122 L690 150"/>
    <path d="M150 246 L150 272 M70 272 L230 272 M70 272 L70 300 M230 272 L230 300"/>
    <path d="M690 246 L690 272 M610 272 L770 272 M610 272 L610 300 M770 272 L770 300"/>
  </g>

  <!-- campagne -->
  <rect x="280" y="28" width="280" height="68" rx="14" fill="#F7F7F8" stroke="#D42D7D" stroke-width="1.5"/>
  <text x="420" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#161221">Campagne</text>
  <text x="420" y="78" text-anchor="middle" font-size="12.5" fill="#6B6580">Budget · pays · 1 emplacement</text>

  <!-- groupes d'annonces -->
  <rect x="20" y="150" width="260" height="96" rx="14" fill="#F7F7F8" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="150" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#161221">Groupe d’annonces</text>
  <text x="150" y="203" text-anchor="middle" font-size="12.5" fill="#6B6580">Enchère par défaut</text>
  <text x="150" y="223" text-anchor="middle" font-size="12.5" fill="#6B6580">Audience · appareils · horaires</text>

  <rect x="560" y="150" width="260" height="96" rx="14" fill="#F7F7F8" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="690" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#161221">Groupe d’annonces</text>
  <text x="690" y="203" text-anchor="middle" font-size="12.5" fill="#6B6580">Enchère par défaut</text>
  <text x="690" y="223" text-anchor="middle" font-size="12.5" fill="#6B6580">Audience · appareils · horaires</text>

  <!-- feuilles -->
  <g font-size="13.5" font-weight="600" fill="#161221">
    <rect x="10" y="300" width="120" height="62" rx="12" fill="#FFFFFF" stroke="#D9D5E0"/>
    <text x="70" y="327" text-anchor="middle">Mots-clés</text>
    <text x="70" y="347" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6B6580">+ négatifs</text>

    <rect x="170" y="300" width="120" height="62" rx="12" fill="#FFFFFF" stroke="#D9D5E0"/>
    <text x="230" y="327" text-anchor="middle">Annonces</text>
    <text x="230" y="347" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6B6580">visuels</text>

    <rect x="550" y="300" width="120" height="62" rx="12" fill="#FFFFFF" stroke="#D9D5E0"/>
    <text x="610" y="327" text-anchor="middle">Mots-clés</text>
    <text x="610" y="347" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6B6580">+ négatifs</text>

    <rect x="710" y="300" width="120" height="62" rx="12" fill="#FFFFFF" stroke="#D9D5E0"/>
    <text x="770" y="327" text-anchor="middle">Annonces</text>
    <text x="770" y="347" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6B6580">visuels</text>
  </g>

  <text x="420" y="400" text-anchor="middle" font-size="12.5" fill="#6B6580">
    Le budget se décide au niveau campagne, l’enchère et le ciblage au niveau groupe d’annonces.
