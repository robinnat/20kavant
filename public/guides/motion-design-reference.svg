  <text x="64" y="448" font-size="14.5" fill="#AEB8F5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3 Éléments : gros titre derrière la tête, 2 s, puis capture.</text>
  <text x="64" y="478" font-size="14.5" fill="#F49AC4" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">4 Zooms : 100 % puis 115 % sur les mots forts.</text>
  <text x="440" y="538" text-anchor="middle" font-size="13.5" fill="#6B6580">Claude ne regarde pas la vidéo à ta place : décris-la avec des mots et des secondes.</text>
