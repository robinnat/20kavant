<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="430" fill="#FFFFFF"/>

  <g stroke="#D9D5E0" stroke-width="1.5">
    <rect x="20" y="20" width="180" height="330" rx="22" fill="#FDFCFE"/>
    <rect x="240" y="20" width="180" height="330" rx="22" fill="#FDFCFE"/>
    <rect x="460" y="20" width="180" height="330" rx="22" fill="#FDFCFE"/>
    <rect x="680" y="20" width="180" height="330" rx="22" fill="#FDFCFE"/>
  </g>

  <!-- 1. Onglet Aujourd'hui : grande carte en haut -->
  <text x="110" y="48" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#6B6580">AUJOURD’HUI</text>
  <rect x="38" y="60" width="144" height="96" rx="12" fill="#FBEAF3" stroke="#D42D7D" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#D42D7D">ANNONCE</text>
  <text x="110" y="120" text-anchor="middle" font-size="10.5" fill="#6B6580">grand format</text>
  <g fill="#EDEAF1">
    <rect x="38" y="170" width="144" height="52" rx="10"/>
    <rect x="38" y="234" width="144" height="52" rx="10"/>
    <rect x="38" y="298" width="144" height="40" rx="10"/>
  </g>
  <text x="110" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#161221">Onglet Aujourd’hui</text>
  <text x="110" y="398" text-anchor="middle" font-size="11" fill="#6B6580">Notoriété, lancements</text>

  <!-- 2. Onglet Recherche : avant la frappe -->
  <text x="330" y="48" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#6B6580">RECHERCHE</text>
  <rect x="258" y="60" width="144" height="26" rx="13" fill="#EDEAF1"/>
  <text x="272" y="78" font-size="10.5" fill="#9A93AA">Rechercher</text>
  <rect x="258" y="98" width="144" height="58" rx="12" fill="#FBEAF3" stroke="#D42D7D" stroke-width="1.5"/>
  <text x="330" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#D42D7D">ANNONCE</text>
  <text x="330" y="141" text-anchor="middle" font-size="10.5" fill="#6B6580">suggestions</text>
  <g fill="#EDEAF1">
    <rect x="258" y="170" width="144" height="34" rx="8"/>
    <rect x="258" y="214" width="144" height="34" rx="8"/>
    <rect x="258" y="258" width="144" height="34" rx="8"/>
  </g>
  <text x="330" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#161221">Onglet Recherche</text>
  <text x="330" y="398" text-anchor="middle" font-size="11" fill="#6B6580">Avant la frappe</text>

  <!-- 3. Résultats de recherche -->
  <text x="550" y="48" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#6B6580">RÉSULTATS</text>
  <rect x="478" y="60" width="144" height="26" rx="13" fill="#EDEAF1"/>
  <text x="492" y="78" font-size="10.5" fill="#6B6580">todo liste</text>
  <rect x="478" y="98" width="144" height="58" rx="12" fill="#FBEAF3" stroke="#D42D7D" stroke-width="1.5"/>
  <text x="550" y="123" text-anchor="middle" font-size="11" font-weight="700" fill="#D42D7D">ANNONCE</text>
  <text x="550" y="141" text-anchor="middle" font-size="10.5" fill="#6B6580">1er résultat</text>
  <g fill="#EDEAF1">
    <rect x="478" y="170" width="144" height="44" rx="10"/>
    <rect x="478" y="224" width="144" height="44" rx="10"/>
    <rect x="478" y="278" width="144" height="44" rx="10"/>
  </g>
  <text x="550" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#161221">Résultats de recherche</text>
  <text x="550" y="398" text-anchor="middle" font-size="11" fill="#6B6580">Intention d’installer</text>

  <!-- 4. Pages de produit -->
  <text x="770" y="48" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#6B6580">PAGE PRODUIT</text>
  <g fill="#EDEAF1">
    <rect x="698" y="60" width="144" height="48" rx="10"/>
    <rect x="698" y="118" width="144" height="60" rx="10"/>
  </g>
  <text x="698" y="203" font-size="10" font-weight="700" fill="#6B6580">VOUS AIMEREZ AUSSI</text>
  <rect x="698" y="212" width="144" height="58" rx="12" fill="#FBEAF3" stroke="#D42D7D" stroke-width="1.5"/>
  <text x="770" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#D42D7D">ANNONCE</text>
  <text x="770" y="255" text-anchor="middle" font-size="10.5" fill="#6B6580">en bas de page</text>
  <rect x="698" y="282" width="144" height="40" rx="10" fill="#EDEAF1"/>
  <text x="770" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#161221">Pages de produit</text>
  <text x="770" y="398" text-anchor="middle" font-size="11" fill="#6B6580">Chez les concurrents</text>
</svg>
