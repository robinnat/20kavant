<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1144" width="400" height="1144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="400" height="1144" fill="#FFFFFF"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B9B3C6"/>
    </marker>
  </defs>
  <text x="20" y="32" font-size="12" font-weight="700" fill="#7A4FBF" letter-spacing="1.3">LE MÊME PRINCIPE POUR LES TROIS</text>
  <rect x="20" y="48" width="360" height="50" rx="12" fill="#FFFFFF" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="36" y="70" font-size="15" font-weight="700" fill="#161221">Ta vidéo coupée</text>
  <text x="36" y="88" font-size="12.5" fill="#6B6580">le fond, jamais touché</text>
  <path d="M 200 100 L 200 112" stroke="#B9B3C6" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="20" y="114" width="360" height="50" rx="12" fill="#FFFFFF" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="36" y="136" font-size="15" font-weight="700" fill="#161221">Couches animées</text>
  <text x="36" y="154" font-size="12.5" fill="#6B6580">page web filmée image par image</text>
  <path d="M 200 166 L 200 178" stroke="#B9B3C6" stroke-width="1.8" marker-end="url(#fl)"/>
  <rect x="20" y="180" width="360" height="50" rx="12" fill="#FFFFFF" stroke="#D42D7D" stroke-width="1.5"/>
  <text x="36" y="202" font-size="15" font-weight="700" fill="#161221">Assemblée en MP4</text>
  <text x="36" y="220" font-size="12.5" fill="#6B6580">FFmpeg</text>
  <rect x="20" y="256" width="360" height="279" rx="16" fill="#FFFFFF" stroke="#7A4FBF" stroke-width="2"/>
  <text x="38" y="288" font-size="19" font-weight="700" fill="#161221">HyperFrames</text>
  <rect x="226" y="271" width="138" height="24" rx="12" fill="#7A4FBF"/>
  <text x="295" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.8">POUR COMMENCER</text>
  <text x="38" y="320" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">TA VIDÉO</text>
  <text x="38" y="340" font-size="14.5" fill="#161221">Acceptée (balise vidéo)</text>
  <text x="38" y="359" font-size="14.5" fill="#161221">Ateliers sous-titres</text>
  <text x="38" y="378" font-size="14.5" fill="#161221">et habillage</text>
  <text x="38" y="408" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">À SAVOIR</text>
  <text x="38" y="428" font-size="14.5" fill="#161221">Ne recoupe pas ta vidéo :</text>
  <text x="38" y="447" font-size="14.5" fill="#161221">coupe-la avant</text>
  <text x="38" y="477" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">CE QUE ÇA DEMANDE</text>
  <text x="38" y="497" font-size="14.5" fill="#161221">Node 22+, FFmpeg</text>
  <text x="38" y="516" font-size="14.5" fill="#161221">Gratuit (Apache 2.0)</text>
  <rect x="20" y="549" width="360" height="279" rx="16" fill="#FFFFFF" stroke="#D9D5E0" stroke-width="1.5"/>
  <text x="38" y="581" font-size="19" font-weight="700" fill="#161221">Remotion</text>
  <text x="364" y="581" text-anchor="end" font-size="12.5" fill="#6B6580">si tu fais déjà du React</text>
  <text x="38" y="613" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">TA VIDÉO</text>
  <text x="38" y="633" font-size="14.5" fill="#161221">Acceptée (OffthreadVideo)</text>
  <text x="38" y="652" font-size="14.5" fill="#161221">Sous-titres avec</text>
  <text x="38" y="671" font-size="14.5" fill="#161221">Whisper.cpp</text>
  <text x="38" y="701" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">À SAVOIR</text>
  <text x="38" y="721" font-size="14.5" font-weight="600" fill="#D42D7D">Licence payante au-delà</text>
  <text x="38" y="740" font-size="14.5" font-weight="600" fill="#D42D7D">de 3 employés</text>
  <text x="38" y="770" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">CE QUE ÇA DEMANDE</text>
  <text x="38" y="790" font-size="14.5" fill="#161221">Node 16+, macOS 15+</text>
  <text x="38" y="809" font-size="14.5" fill="#161221">un projet React</text>
  <rect x="20" y="842" width="360" height="260" rx="16" fill="#FFFFFF" stroke="#D9D5E0" stroke-width="1.5"/>
  <text x="38" y="874" font-size="19" font-weight="700" fill="#161221">HTML maison</text>
  <text x="364" y="874" text-anchor="end" font-size="12.5" fill="#6B6580">ce que j'utilise</text>
  <text x="38" y="906" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">TA VIDÉO</text>
  <text x="38" y="926" font-size="14.5" fill="#161221">Calque transparent posé</text>
  <text x="38" y="945" font-size="14.5" fill="#161221">dessus par FFmpeg</text>
  <text x="38" y="975" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">À SAVOIR</text>
  <text x="38" y="995" font-size="14.5" fill="#161221">Tout est à construire</text>
  <text x="38" y="1014" font-size="14.5" fill="#161221">et à entretenir</text>
  <text x="38" y="1044" font-size="11" font-weight="700" fill="#6B6580" letter-spacing="1.1">CE QUE ÇA DEMANDE</text>
  <text x="38" y="1064" font-size="14.5" fill="#161221">Node, FFmpeg, Chrome</text>
  <text x="38" y="1083" font-size="14.5" fill="#161221">ton outil de détourage</text>
  <text x="200" y="1124" text-anchor="middle" font-size="13.5" fill="#6B6580">Ta vidéo reste dessous, intacte.</text>
</svg>
