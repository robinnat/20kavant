<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="440" fill="#FFFFFF"/>

  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B9B3C6"/>
    </marker>
    <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#127A4B"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#6B6580">OÙ PASSE LA CLÉ</text>

  <!-- chaîne principale -->
  <g>
    <rect x="40" y="80" width="170" height="92" rx="14" fill="#FAF8FC" stroke="#D9D5E0" stroke-width="1.5"/>
    <text x="125" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#161221">Toi</text>
    <text x="125" y="142" text-anchor="middle" font-size="12" fill="#6B6580">« Génère une image »</text>

    <rect x="250" y="80" width="170" height="92" rx="14" fill="#FAF8FC" stroke="#7A4FBF" stroke-width="1.5"/>
    <text x="335" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#161221">Claude / Codex</text>
    <text x="335" y="142" text-anchor="middle" font-size="12" fill="#6B6580">choisit l'outil</text>

    <rect x="460" y="80" width="170" height="92" rx="14" fill="#FAF8FC" stroke="#7A4FBF" stroke-width="1.5"/>
    <text x="545" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#161221">Connecteur</text>
    <text x="545" y="142" text-anchor="middle" font-size="12" fill="#6B6580">serveur MCP</text>

    <rect x="670" y="80" width="170" height="92" rx="14" fill="#FDF4F8" stroke="#D42D7D" stroke-width="1.5"/>
    <text x="755" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#161221">API</text>
    <text x="755" y="142" text-anchor="middle" font-size="12" fill="#6B6580">Higgsfield, etc.</text>
  </g>
  <g stroke="#B9B3C6" stroke-width="1.8" marker-end="url(#fl)">
    <path d="M 214 126 L 244 126"/>
    <path d="M 424 126 L 454 126"/>
  </g>
  <!-- le seul tronçon qui porte la clé -->
  <path d="M 634 126 L 664 126" stroke="#127A4B" stroke-width="2.4" marker-end="url(#fv)"/>

  <!-- coffre -->
  <rect x="460" y="232" width="170" height="80" rx="14" fill="#EEF7F2" stroke="#127A4B" stroke-width="1.5"/>
  <text x="545" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#127A4B">Coffre</text>
  <text x="545" y="287" text-anchor="middle" font-size="12" fill="#3E6B55">trousseau ou variable</text>
  <path d="M 545 228 L 545 178" stroke="#127A4B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#fv)"/>
  <text x="560" y="206" font-size="11.5" fill="#127A4B">lit la clé</text>

  <!-- chemin interdit -->
  <path d="M 125 176 C 125 250, 300 250, 330 180" fill="none" stroke="#D42D7D" stroke-width="1.8" stroke-dasharray="5 4"/>
  <g transform="translate(224 236)">
    <circle r="14" fill="#FFFFFF" stroke="#D42D7D" stroke-width="1.8"/>
    <path d="M -6 -6 L 6 6 M 6 -6 L -6 6" stroke="#D42D7D" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="125" y="290" font-size="12.5" font-weight="700" fill="#D42D7D">Jamais la clé dans la conversation</text>
  <text x="125" y="309" font-size="12" fill="#6B6580">historique, journaux, écran filmé :</text>
  <text x="125" y="326" font-size="12" fill="#6B6580">elle y reste et elle se voit</text>

  <text x="440" y="400" text-anchor="middle" font-size="12.5" fill="#6B6580">
    Claude et Codex n'ont jamais besoin de connaître ta clé : seul le connecteur la lit, au moment d'appeler l'API.
  </text>
</svg>
